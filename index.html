<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yt-dlp Comprehensive GUI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">yt-dlp comprehensive GUI</p>
          <h1>Command builder from yt-dlp help text</h1>
        </div>
        <div class="hero-panel">
          <label for="url-input">Link required to run</label>
          <input id="url-input" type="url" placeholder="https://www.youtube.com/watch?v=..." />
          <div class="button-row">
            <button id="run-button" class="primary">Run yt-dlp</button>
            <button id="config-button">Generate config file</button>
          </div>
          <p id="status-line" class="status-line">Loading yt-dlp help output...</p>
        </div>
      </header>

      <section class="preview-card">
        <div class="preview-header">
          <h2>Command preview</h2>
          <span id="section-count"></span>
        </div>
        <pre id="command-preview">Waiting for help data...</pre>
      </section>

      <nav id="tab-bar" class="tab-bar" aria-label="yt-dlp help sections"></nav>
      <main id="tab-panels" class="tab-panels"></main>

      <section class="output-card">
        <div class="preview-header">
          <h2>Run output</h2>
          <span>stdout and stderr</span>
        </div>
        <pre id="output-panel">No command has been run yet.</pre>
      </section>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
